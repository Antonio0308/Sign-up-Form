<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Sign Up</title>
  </head>
  <body>
    <div>
      <div>
        <img src="./images/odin-logo.png" alt="odin-logo" height="100" />
        <h1>ODIN</h1>
      </div>
    </div>
    <div>
      <div>
        <p>
          This is not a real online service! You knoz you need something
          <br />like this in your life to help you realize your deepest dreams.
          <br />
          Sign up <em>now</em> to get started.
        </p>
        <p>You <em>know</em> you want to.</p>
      </div>
      <div>
        <h2>Let's do this!</h2>
        <form action="">
          <div>
            <div>
              <div>
                <label for="firstname">FIRST NAME</label>
                <div>
                  <input type="text" name="user_firstname" id="firstname" />
                </div>
              </div>
              <div>
                <label for="lastname">LAST NAME</label>
                <div>
                  <input type="text" name="user_lastname" id="lastname" />
                </div>
              </div>
            </div>
            <div>
              <div>
                <label for="email">EMAIL</label>
                <div><input type="email" name="user_email" id="email" /></div>
              </div>
              <div>
                <label for="phone_number">PHONE NUMBER</label>
                <div>
                  <input type="tel" name="user_number" id="phone_number" />
                </div>
              </div>
            </div>
            <div>
              <div>
                <label for="password">PASSWORD</label>
                <div>
                  <input type="password" name="user_password" id="password" />
                </div>
              </div>
              <div>
                <label for="confirm_password">CONFIRM PASSWORD</label>
                <div><input type="password" id="confirm_password" /></div>
              </div>
            </div>
          </div>
          <button>Create Account</button>
        </form>
        <p>Already have an account? <a href="#">Log in</a></p>
      </div>
    </div>
  </body>
</html>
