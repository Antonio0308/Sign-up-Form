<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Sign Up</title>
  </head>
  <body>
    <div class="container-one">
      <div class="logo">
        <img src="./images/odin-logo.png" alt="odin-logo" height="100" />
        <h1>ODIN</h1>
      </div>
      <div class="credits">
        Photo by <a href="#">Halie West</a> on
        <a href="#">Unpslash</a>
      </div>
    </div>
    <div class="container-two">
      <div class="para">
        <p>
          This is not a real online service! You knoz you need something
          <br />like this in your life to help you realize your deepest dreams.
          <br />
          Sign up <em>now</em> to get started.
        </p>
        <p>You <em>know</em> you want to.</p>
      </div>
      <div>
        <form action="">
          <div class="register-form">
            <h2>Let's do this!</h2>
            <div>
              <div class="section-form">
                <div>
                  <label for="firstname">FIRST NAME</label>
                  <div>
                    <input
                      type="text"
                      name="user_firstname"
                      id="firstname"
                      required
                    />
                  </div>
                </div>
                <div>
                  <label for="lastname">LAST NAME</label>
                  <div>
                    <input
                      type="text"
                      name="user_lastname"
                      id="lastname"
                      required
                    />
                  </div>
                </div>
              </div>
              <div class="section-form">
                <div>
                  <label for="email">EMAIL</label>
                  <div>
                    <input type="email" name="user_email" id="email" required />
                  </div>
                </div>
                <div>
                  <label for="phone_number">PHONE NUMBER</label>
                  <div>
                    <input
                      type="tel"
                      name="user_number"
                      id="phone_number"
                      required
                    />
                  </div>
                </div>
              </div>
              <div class="section-form">
                <div>
                  <label for="password">PASSWORD</label>
                  <div>
                    <input
                      type="password"
                      name="user_password"
                      id="password"
                      required
                    />
                  </div>
                </div>
                <div>
                  <label for="confirm_password">CONFIRM PASSWORD</label>
                  <div>
                    <input type="password" id="confirm_password" required />
                  </div>
                </div>
              </div>
            </div>
          </div>
          <button type="submit">Create Account</button>
        </form>

        <p class="log-in">Already have an account? <a href="#">Log in</a></p>
      </div>
    </div>
  </body>
</html>
